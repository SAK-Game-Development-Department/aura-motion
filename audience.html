<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>AURA — audience</title>
  </head>
  <body>
    <div class="grid">
      <div class="logo">AURA</div>
      <section class="live">
        <div id="section"></div>
        <div id="score"></div>
        <div id="combo"></div>
        <div class="barw"><div id="bar"></div></div>
        <canvas id="mini" aria-label="player hands"></canvas>
      </section>
      <section class="side">
        <div><h2>本日のランキング</h2><ol id="rank"></ol></div>
        <div class="how">
          <h2>どうやって動いているの？</h2>
          <ol>
            <li>カメラの映像から、AI が <b>手の21か所の関節</b> を毎秒30回 検出します（このパソコンの中だけで計算）</li>
            <li>指の曲がる角度・指先どうしの距離から <b>手の形</b> を、指先の軌跡と手の大きさの変化から <b>動き</b> を見分けて、技にします</li>
            <li>手のまわりに <b>数十万個の光の粒</b> を GPU で動かし、カメラ→画面の遅れを測って指先を <b>先読み</b> して描いています</li>
          </ol>
          <div class="nums">
            <div>遅れ<b id="n-lat">-</b></div>
            <div>光の粒<b id="n-par">-</b></div>
            <div>描画<b id="n-fps">-</b></div>
            <div>認識<b id="n-trk">-</b></div>
            <div>GPU<b id="n-be">-</b></div>
          </div>
        </div>
      </section>
    </div>
    <div id="status"></div>
    <div class="privacy">映像は保存・送信していません</div>
    <script type="module" src="/src/audience/audience.ts"></script>
  </body>
</html>
